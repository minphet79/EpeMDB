{% extends "base.html" %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700">
        <div>
            <h2 class="mt-6 text-center text-2xl font-bold text-white">
                🔒 Acceso de Administrador
            </h2>
            <p class="mt-2 text-center text-sm text-gray-400">
                Introduce la contraseña para poder editar la colección
            </p>
        </div>
        
        {% if error %}
        <div class="bg-red-900/50 border border-red-600 text-red-200 px-4 py-3 rounded text-sm text-center">
            {{ error }}
        </div>
        {% endif %}
        
        <form class="mt-8 space-y-6" action="/login" method="POST">
            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Contraseña</label>
                <input id="password" name="password" type="password" required autofocus
                       class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-600 placeholder-gray-500 text-white bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
                       placeholder="••••••••">
            </div>
            
            <div class="flex flex-col gap-3">
                <button type="submit" class="w-full py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition">
                    Entrar
                </button>
                <a href="/" class="text-center text-sm text-gray-400 hover:text-white transition">
                    ← Volver al inicio
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
