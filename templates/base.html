<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>EpeMDB</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
    
    <!-- Barra de Navegación Superior -->
    <nav class="bg-gray-800 border-b border-gray-700 p-3 sm:p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
            
            <!-- Logo (el doble de grande en pantallas medianas/grandes) -->
            <a href="/" class="flex items-center gap-2 hover:opacity-80 transition flex-shrink-0">
                <img src="/static/logo.png" alt="EpeMDB Logo" class="h-16 sm:h-24 w-auto shadow-lg">
            </a>
            
            <!-- Botón Añadir -->
            <a href="/add" class="bg-blue-600 hover:bg-blue-700 px-4 sm:px-6 py-2 sm:py-3 rounded text-sm sm:text-base font-medium transition shadow flex-shrink-0">
                + Añadir
            </a>
            
        </div>
    </nav>
    
    <!-- Contenido Principal -->
    <main class="flex-grow max-w-7xl mx-auto w-full p-3 sm:p-4 md:p-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer discreto -->
    <footer class="text-center text-xs text-gray-600 py-4 border-t border-gray-800 mt-8">
        EpeMDB · Colección personal
    </footer>

</body>
</html>
